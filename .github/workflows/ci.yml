name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests (policy invariants, evidence, story, messages)
        run: node --test tests/core.test.js
      - name: Build single-file bundle
        run: node scripts/bundle.js
